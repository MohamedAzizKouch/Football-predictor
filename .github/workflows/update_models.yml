name: Refresh football prediction models

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy scipy requests

      - name: Fetch real data, train all leagues, run backtest, fetch ClubElo ratings
        run: python train_and_export.py

      - name: Commit updated files (only if changed)
        if: always()
        run: |
          git config user.name "football-predictor-bot"
          git config user.email "actions@github.com"
          for f in models.json backtest.json elo_ratings.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "Auto-refresh models + backtest + ClubElo ($(date -u +%Y-%m-%d))"
          git push
